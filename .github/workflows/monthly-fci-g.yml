name: Monthly FCI-G

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "exact or flash"
        required: true
        default: "exact"
  schedule:
    # Run after the typical Zillow ZHVI release window. Adjust if Zillow's
    # release calendar changes.
    - cron: "0 14 21 * *"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        run: pytest

      - name: Download raw inputs if configured
        env:
          PRIMARY_RAW_DATA_URL: ${{ secrets.PRIMARY_RAW_DATA_URL }}
          REDFIN_HOME_PRICE_URL: ${{ secrets.REDFIN_HOME_PRICE_URL }}
        run: |
          if [ -n "$PRIMARY_RAW_DATA_URL" ] && [ ! -f primary_raw.csv ]; then
            curl --fail --location "$PRIMARY_RAW_DATA_URL" --output primary_raw.csv
          fi
          if [ -n "$REDFIN_HOME_PRICE_URL" ] && [ ! -f redfin_home_price_index.csv ]; then
            curl --fail --location "$REDFIN_HOME_PRICE_URL" --output redfin_home_price_index.csv
          fi

      - name: Build primary and Redfin-flash FCI-G
        run: |
          if [ ! -f primary_raw.csv ]; then
            echo "No primary_raw.csv found. Commit one or configure PRIMARY_RAW_DATA_URL."
            exit 1
          fi
          if [ ! -f redfin_home_price_index.csv ]; then
            echo "No redfin_home_price_index.csv found. Commit one or configure REDFIN_HOME_PRICE_URL."
            exit 1
          fi
          python -m fci_g.build_series \
            --primary-raw primary_raw.csv \
            --redfin redfin_home_price_index.csv \
            --multipliers data/multipliers.csv \
            --out-dir output

      - name: Upload outputs
        uses: actions/upload-artifact@v4
        with:
          name: fci-g-output
          path: output/*.csv
